# One entry per model in the sweep. Comment out to skip.
#
# Fields:
#   id    HF repo id
#   gpus  SLURM --gpus-per-node value, e.g. A40:1 or A100fat:2
#   time  SLURM walltime (HH:MM:SS)
#
# Alvis single-node ceilings: A40 4x48GB=192GB, A100 4x40GB=160GB, A100fat 4x80GB=320GB.
# Sizing rule of thumb: total VRAM >= 1.5 * params * bytes_per_param
# (bytes_per_param = 2 for fp16/bf16, 1 for FP8). 1.5x covers KV cache + activations
# at n=50, max_tokens=2048. Tighten gpu_memory_utilization in run_generation if a
# specific model still OOMs. Times are best guesses -- bump after a first run.

# Test sweep: only the three smallest models are active. Uncomment the rest for the full run.
- id: Qwen/Qwen2.5-3B-Instruct
  gpus: A40:1
  time: "02:00:00"

