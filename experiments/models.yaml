# Canonical model registry. Consumed by:
#   experiments/sweep_models.py     - SLURM sweep (entries with gpus/time)
#   experiments/submit_sweep.sh     - SLURM submission (entries with gpus/time)
#   experiments/run_metrics.py      - Analysis & F-tests (all entries with embeddings)
#
# Comment an entry out to skip it everywhere.
#
# Fields:
#   id            HF repo id (OSS) or bare model name (API). Required.
#   display_name  Human-readable label used in plot legends and metric outputs.
#   family        Group label used for F-tests / family-level aggregation.
#   gpus          SLURM --gpus-per-node value (OSS only). Presence => included in sweep.
#   time          SLURM walltime HH:MM:SS (OSS only).
#
# On-disk slug for embeddings is derived as id.replace("/", "_").
#
# Single-node ceilings (typed-GRES cluster): A40 4x48GB=192GB, A100 4x40GB=160GB,
# A100fat 4x80GB=320GB. Sizing rule of thumb: total VRAM >= 1.5 * params * bytes_per_param
# (bytes_per_param = 2 for fp16/bf16, 1 for FP8). 1.5x covers KV cache + activations
# at n=50, max_tokens=2048. Tighten gpu_memory_utilization in run_generation if a
# specific model still OOMs. Times are best guesses -- bump after a first run.
#
# API entries have no gpus/time and skip SLURM. Run them directly:
#   python -m experiments.run_generation --model claude-opus-4-7

